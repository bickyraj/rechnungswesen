services:
  postgres:
    image: postgres:16
    container_name: rechnungswesen-postgres
    environment:
      POSTGRES_USER: rechnungswesen
      POSTGRES_PASSWORD: rechnungswesen
      POSTGRES_DB : rechnungswesen
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-keycloak-db.sql:/docker-entrypoint-initdb.d/init-keycloak-db.sql
    networks:
      - rechnungswesen-net
  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    container_name: rechnungswesen-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
#      KC_HTTP_ENABLED: true
#      KC_PROXY_HEADERS: xforwarded
#      KC_HOSTNAME: https://candyhms.duckdns.org/auth
#      KC_HOSTNAME_STRICT: false
    ports:
      - "8082:8080"
    depends_on:
      - postgres
    networks:
      - rechnungswesen-net
  kafka:
    image: apache/kafka:4.0.0
    container_name: rechnungswesen-kafka
    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    networks:
      - rechnungswesen-net
  kafka-init:
    image: apache/kafka:4.0.0
    container_name: rechnungswesen-kafka-init
    depends_on:
      - kafka
    networks:
      - rechnungswesen-net
    volumes:
      - ./kafka/init-topics.sh:/init-topics.sh
    entrypoint: [ "/bin/bash", "/init-topics.sh" ]
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    ports:
      - "9411:9411"
    restart: unless-stopped
    networks:
      - rechnungswesen-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.6
    container_name: rechnungswesen-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - rechnungswesen-net

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.6
    container_name: rechnungswesen-kibana
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=["http://elasticsearch:9200"]
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=2de719f9d390738d05e829e33120b2be65a73b5ee8184f2bcb0d3b6d1ab4cae0
    ports:
      - "127.0.0.1:5601:5601"
    networks:
      - rechnungswesen-net

  logstash:
    image: docker.elastic.co/logstash/logstash:9.5.6
    container_name: rechnungswesen-logstash
    depends_on:
      - elasticsearch
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    networks:
      - rechnungswesen-net

volumes:
  postgres_data:
  elasticsearch_data:

networks:
  rechnungswesen-net:
    external: true

