databaseChangeLog:
  - changeSet:
      id: 003-create-payment
      author: backend
      changes:
        - createTable:
            tableName: payments
            columns:

              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: source_account_id
                  type: bigint
                  constraints:
                    nullable: false

              - column:
                  name: destination_account_id
                  type: bigint
                  constraints:
                    nullable: false

              - column:
                  name: amount
                  type: NUMERIC(19,4)
                  constraints:
                    nullable: false

              - column:
                  name: currency
                  type: CHAR(3)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: idempotency_key
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueDate: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: completed_at
                  type: TIMESTAMP WITH TIME ZONE

        - addForeignKeyConstraint:
            baseTableName: payments
            baseColumnNames: source_account_id
            referencedTableName: accounts
            referencedColumnNames: id
            constraintName: fk_payment_source_account

        - addForeignKeyConstraint:
            baseTableName: payments
            baseColumnNames: destination_account_id
            referencedTableName: accounts
            referencedColumnNames: id
            constraintName: fk_payment_destination_account

        - addUniqueConstraint:
            tableName: payments
            columnNames: idempotency_key
            constraintName: uk_payment_idempotency_key

        - sql:
            sql: >
              ALTER TABLE payments
              ADD CONSTRAINT payment_amount_positive
              CHECK (amount > 0);

        - sql:
            sql: >
              ALTER TABLE payments
              ADD CONSTRAINT payment_status_check
              CHECK (status IN ('CREATED', 'PENDING', 'COMPLETED', 'FAILED'));