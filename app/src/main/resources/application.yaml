spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      file-size-threshold: 10MB
  application:
    name: accounting
  datasource:
    url: jdbc:postgresql://localhost:5432/rechnungswesen
    username: rechnungswesen
    password: rechnungswesen
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_SERVER_URL}/realms/${keycloak.realm}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/changelog-master.yaml
keycloak:
  realm: rechnungswesen
  server-url: ${KEYCLOAK_SERVER_URL}
  client-id: bank-backend
  admin-realm: master
  secret: ${KEYCLOAK_CLIENT_SECRET}
server:
  port: 8084

